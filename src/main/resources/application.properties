quarkus.banner.enabled=false
quarkus.application.name=headlessmc-web

# The web UI can run arbitrary HeadlessMc commands and launch processes, only listen on localhost by default.
quarkus.http.host=127.0.0.1
quarkus.http.port=8080

# Mods, resource packs and shaders are dragged into the web ui, they can be large.
quarkus.http.limits.max-body-size=512M

# HeadlessMc beans (commands, completions) are looked up programmatically by picocli, keep them.
quarkus.arc.unremovable-types=io.github.headlesshq.headlessmc.**

# HeadlessMc logs its own console output at WARN, the web layer forwards hmc logs to the browser instead.
quarkus.log.level=INFO
quarkus.log.category."java.lang.ProcessBuilder".level=INFO
hmc.log.console-level=INFO

# Minimum level of HeadlessMc log records forwarded to the browser console.
hmc.web.log-level=INFO

# Frontend (Vue + TypeScript, Vite) served by Quinoa
quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.dev-server.port=5173
# Keep the API and websocket with Quarkus, otherwise Quinoa forwards them to Vite which proxies them back -> loop
quarkus.quinoa.ignored-path-prefixes=/api,/ws,/q

# During development place HeadlessMc files relative to the project (gitignored)
%dev.hmc.files.location=HeadlessMC
%test.hmc.files.location=build/test-hmc
